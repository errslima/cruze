[project]
name = "cruze"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.5",
    "maxminddb>=3.2.0",
]

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
