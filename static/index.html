<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cruze</title>
  <link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body>
  <main class="stage" aria-label="Video call">
    <video id="remote" autoplay playsinline></video>
    <div id="placeholder" data-state="OFFLINE" aria-hidden="true"><span class="indicator"></span></div>
    <div class="sr-only" role="status" aria-live="polite"><span id="status">Ready</span><span id="detail"></span><span id="connection">OFFLINE</span></div>
    <button id="play" class="play" aria-label="Play partner’s video" title="Play video" hidden>▶</button>
    <div class="preview"><video id="local" autoplay playsinline muted></video></div>
    <nav class="controls" aria-label="Call controls">
      <button id="start" class="primary">Start</button>
      <button id="next" class="primary" hidden disabled>Skip</button>
      <button id="block" class="block" disabled>Block</button>
      <button id="stop" class="stop" disabled>Stop</button>
      <span class="divider" aria-hidden="true"></span>
      <div class="camera-controls">
      <button id="camera" class="toggle" disabled aria-pressed="false" aria-label="Turn camera off" title="Turn camera off">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="12" height="12" rx="3"/><path d="m15 10 6-3v10l-6-3"/><path class="slash" d="M3 3 21 21"/></svg>
      </button>
      <select id="camera-select" aria-label="Choose camera" title="Choose camera"><option value="">Default camera</option></select>
      </div>
      <button id="mic" class="toggle" disabled aria-pressed="false" aria-label="Mute microphone" title="Mute microphone">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/><path class="slash" d="M3 3 21 21"/></svg>
      </button>
    </nav>
    <p id="camera-error" role="alert" hidden></p>
  </main>
  <dialog id="block-dialog" aria-labelledby="block-title" aria-describedby="block-description">
    <h1 id="block-title">Block this user’s IP address?</h1>
    <p id="block-description">You won’t be matched with this IP address for one year in this browser.</p>
    <p id="block-error" role="alert" hidden></p>
    <div class="age-actions"><button id="cancel-block" autofocus>Cancel</button><button id="confirm-block" class="stop">Block</button></div>
  </dialog>
  <dialog id="age-gate" aria-labelledby="age-title" aria-describedby="age-description">
    <h1 id="age-title">Are you 18 or older?</h1>
    <p id="age-description">You must be at least 18 to enter.</p>
    <div class="age-actions"><button id="leave">Leave</button><button id="confirm-age" class="primary" autofocus>Yes, I’m 18+</button></div>
  </dialog>
</body>
</html>
